controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 1000  # Hz (rl_sar 의 PD 는 컨트롤러에서 이 주기로 계산됨)

    joint_states_controller:
      type: joint_state_broadcaster/JointStateBroadcaster

    robot_joint_controller:
      type: robot_joint_controller/RobotJointControllerGroup

robot_joint_controller:
  ros__parameters:
    use_sim_time: True
    # 순서 중요: rl_sar policy/a1/base.yaml 의 joint_names 와 같아야 함 (FR, FL, RR, RL)
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
